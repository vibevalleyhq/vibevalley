[package]
name = "vibevalley-mac"
version = "0.1.0"
edition = "2024"

[dependencies]
percent-encoding = "2.3.2"
raw-window-handle = "0.6.2"
base64 = { workspace = true }
block2 = "0.6.2"
vibevalley-files = { version = "0.1.0", path = "../../crates/files" }
vibevalley-git = { version = "0.1.0", path = "../../crates/git" }
vibevalley-i18n = { version = "0.1.0", path = "../../crates/i18n" }
vibevalley-protocol = { version = "0.1.0", path = "../../crates/protocol" }
vibevalley-rich = { version = "0.1.0", path = "../../crates/rich" }
vibevalley-runtime = { version = "0.1.0", path = "../../crates/runtime" }
vibevalley-server = { version = "0.1.0", path = "../../crates/server" }
vibevalley-diorama = { version = "0.1.0", path = "crates/diorama" }
vibevalley-terminal = { version = "0.1.0", path = "crates/terminal" }
vibevalley-workspace = { version = "0.1.0", path = "crates/workspace" }
flume = { workspace = true }
gpui = { package = "gpui-fast", version = "0.1.19", default-features = false, features = ["font-kit"] }
gpui-platform = { package = "gpui-fast-platform", version = "0.1.19", default-features = false, features = ["font-kit"] }
image = { workspace = true }
indexmap = "2.14.2"
jiff = { workspace = true }
nsh-base = { version = "0.7.1", default-features = false }
nsh-engine = { version = "0.7.1", default-features = false }
nsh-platform-gpui = { version = "0.7.1", default-features = false, features = ["js", "webview", "editor", "math", "svg"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSBundle",
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
  "NSURL",
  "objc2-core-foundation",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smallvec = "1.16.5"
unicode-segmentation = "1.13.3"
rustybuzz = "0.20.1"
unicode-width = "0.2.3"
uuid = { workspace = true }
zip = { version = "9.7.1", default-features = false }

backon = { workspace = true }
parking_lot = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }

[features]
default = []
# Load hosted views from `nsh dev --server-only` (VIBEVALLEY_UI_DEV=ws://...) with hot reload.
nsh-dev = ["nsh-platform-gpui/dev"]
# `shot:<png>` in debug scripts: draws the window and reads the Metal frame back (works while the screen is locked).
shot = ["gpui/test-support", "gpui-platform/test-support"]

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tempfile = { workspace = true }
