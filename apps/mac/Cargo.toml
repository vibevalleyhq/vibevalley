[package]
name = "vibevalley-mac"
version = "0.1.0"
edition = "2024"

[dependencies]
percent-encoding = "2.3.2"
vibevalley-pixel = { version = "0.1.0", path = "../../crates/vibevalley-pixel" }
vibevalley-server-api = { version = "0.1.0", path = "../../crates/vibevalley-server-api" }
base64 = "0.23.1"
vibevalley-i18n = { version = "0.1.0", path = "../../crates/vibevalley-i18n" }
vibevalley-protocol = { version = "0.1.0", path = "../../crates/vibevalley-protocol" }
vibevalley-bridge = { version = "0.1.0", path = "../../crates/vibevalley-bridge" }
vibevalley-files = { version = "0.1.0", path = "../../crates/vibevalley-files" }
vibevalley-highlight = { version = "0.1.0", path = "../../crates/vibevalley-highlight" }
vibevalley-git = { version = "0.1.0", path = "../../crates/vibevalley-git" }
vibevalley-server = { version = "0.1.0", path = "../../crates/vibevalley-server" }
vibevalley-http = { version = "0.1.0", path = "../../crates/vibevalley-http" }
vibevalley-terminal = { version = "0.1.0", path = "../../crates/vibevalley-terminal" }
vibevalley-workspace = { version = "0.1.0", path = "../../crates/vibevalley-workspace" }
flume = "0.12.0"
gpui = { package = "gpui-fast", version = "0.1.17", default-features = false, features = ["font-kit"] }
gpui-platform = { package = "gpui-fast-platform", version = "0.1.17", default-features = false, features = ["font-kit"] }
image = { workspace = true }
indexmap = "2.14.2"
nsh-base = { version = "0.6.0", default-features = false }
nsh-engine = { version = "0.6.0", default-features = false }
nsh-platform-gpui = { version = "0.6.0", default-features = false, features = ["js", "webview", "editor", "highlight", "svg"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSString", "objc2-core-foundation"] }
serde = { workspace = true }
serde_json = "1.0.154"
sha2 = "0.11.1"
smallvec = "1.16.5"
unicode-segmentation = "1.13.3"
rustybuzz = "0.20.1"
unicode-width = "0.2.3"
uuid = { workspace = true }

tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[features]
default = []
# Load hosted views from `nsh dev --server-only` (VIBEVALLEY_UI_DEV=ws://...) with hot reload.
nsh-dev = ["nsh-platform-gpui/dev"]
# `shot:<png>` in debug scripts: draws the window and reads the Metal frame back (works while the screen is locked).
shot = ["gpui/test-support", "gpui-platform/test-support"]

[dev-dependencies]
tempfile = "3.27.0"
