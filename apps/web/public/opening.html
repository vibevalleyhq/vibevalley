<!doctype html>
<!-- The opening markers are inlined into index.html by vite.config.ts; Electron loads this file before its server starts. -->
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeValley</title>
    <style>
      @font-face {
        font-family: "FusionPixel";
        src: url("fonts/fusion-pixel-12px-proportional-zh_hans.otf");
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- opening -->
    <style>
      #opening {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        background: #151413;
        color: #f7e8c4;
        font: 12px/1.5 "FusionPixel", "PingFang SC", sans-serif;
        user-select: none;
      }
      #opening .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        image-rendering: pixelated;
      }
      #opening[data-scene="day"] .scene {
        object-position: 65% center;
      }
      #opening::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 40%, #15141344 65%, #151413dd);
      }
      #opening .column {
        position: absolute;
        z-index: 1;
        bottom: max(32px, 6%);
        left: 50%;
        width: min(400px, calc(100% - 64px));
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      #opening .brand {
        margin: 0;
        text-align: center;
        white-space: nowrap;
        font: 48px/1.2 "FusionPixel", monospace;
        text-shadow: 3px 3px 0 #2f1f13;
      }
      #opening .runway {
        position: relative;
        width: 100%;
        margin-top: 64px;
        --progress: 0%;
      }
      #opening .bar {
        box-sizing: border-box;
        height: 20px;
        padding: 3px;
        border: 3px solid #2f1f13;
        background: #292f20;
        box-shadow: 0 0 0 2px #eedcb2, 0 5px 0 2px #2f1f13;
      }
      #opening .fill {
        width: var(--progress);
        height: 100%;
        background: repeating-linear-gradient(90deg, #a4c66c 0 8px, #86ad50 8px 10px);
        box-shadow: inset 0 2px #d9e5a2;
      }
      #opening .sprite-position {
        position: absolute;
        left: clamp(32px, var(--progress), calc(100% - 32px));
        bottom: 10px;
        transform: translateX(-50%);
        pointer-events: none;
      }
      #opening .sprite {
        display: block;
        width: 80px;
        height: 96px;
        background-size: 500% auto;
        background-position: 0% center;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        animation: opening-breathe 1.4s steps(2) infinite;
      }
      #opening[data-mood="working"] .sprite { background-position-x: 25%; animation: opening-step 500ms steps(2) infinite; }
      #opening[data-mood="excited"] .sprite { background-position-x: 50%; animation: opening-step 350ms steps(2) infinite; }
      #opening[data-mood="happy"] .sprite { background-position-x: 75%; animation: opening-jump 240ms steps(4); }
      #opening[data-mood="confused"] .sprite { background-position-x: 100%; animation: none; }
      #opening .words { text-shadow: 1px 1px 0 #2f1f13; }
      #opening .note {
        margin-top: -8px;
        text-align: center;
        color: #eedcb2;
        text-shadow: 1px 1px 0 #2f1f13;
      }
      #opening .download {
        color: #f7e8c4;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-shadow: 1px 1px 0 #2f1f13;
      }
      #opening [hidden] { display: none; }
      #opening .problem {
        box-sizing: border-box;
        width: 100%;
        max-height: 25vh;
        padding: 12px;
        overflow-y: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        text-align: left;
        user-select: text;
        background: #151413e6;
      }
      @keyframes opening-breathe { 50% { transform: translateY(2px); } }
      @keyframes opening-step { 50% { transform: translateY(-3px); } }
      @keyframes opening-jump { 50% { transform: translateY(-12px); } }
      @media (max-width: 600px) {
        #opening[data-scene="day"] .scene,
        #opening[data-scene="night"] .scene { object-position: 80% center; }
        #opening .brand { font-size: 36px; }
        #opening .column { bottom: max(28px, env(safe-area-inset-bottom)); }
      }
      @media (max-height: 500px) {
        #opening .brand { font-size: 24px; }
        #opening .column { bottom: 24px; gap: 8px; }
        #opening .runway { margin-top: 48px; }
        #opening .sprite { width: 64px; height: 77px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #opening .sprite { animation: none !important; }
        #opening .sprite-position { left: 32px; }
      }
    </style>
    <div id="opening">
      <img class="scene" alt="" fetchpriority="high" />
      <div class="column">
        <p class="brand"></p>
        <div class="runway">
          <span class="sprite-position" aria-hidden="true"><span class="sprite"></span></span>
          <div class="bar" role="progressbar"><div class="fill"></div></div>
        </div>
        <span class="words"></span>
        <span class="note" hidden></span>
        <a class="download" target="_blank" rel="noreferrer" data-testid="update-download" hidden></a>
      </div>
    </div>
    <script>
      {
        // The build replaces the catalog marker for both file:// and HTTP entry points.
        const openingWords = "__OPENING_WORDS__";
        const locale = document.documentElement.dataset.locale ?? new URLSearchParams(location.search).get("locale");
        const said = openingWords[locale] ?? openingWords.zh;
        const cover = document.getElementById("opening");
        const nativeOpening = Boolean(window.vibevalleyHost?.opening);
        cover.hidden = nativeOpening;
        const bar = cover.querySelector(".bar");
        const words = cover.querySelector(".words");
        const runway = cover.querySelector(".runway");
        const note = cover.querySelector(".note");
        const download = cover.querySelector(".download");
        // The desktop app's update (apps/desktop src/window.ts updating): the steps of a restart into a new version.
        const updateSteps = ["stopping", "swapping", "updateFailed"];
        cover.querySelector(".brand").textContent = said.name;
        document.title = said.name;
        bar.setAttribute("aria-label", said.label);
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
        const started = performance.now();
        let displayed = 0;
        let frame;
        let timer;
        const stop = () => {
          cancelAnimationFrame(frame);
          clearTimeout(timer);
        };
        const dispose = () => {
          stop();
          observer.disconnect();
          cover.removeEventListener("opening-update", paint);
          window.removeEventListener("pagehide", dispose);
        };
        const terminal = () => Boolean(cover.dataset.problem) || ["ready", "waiting", "failed", "updateFailed"].includes(cover.dataset.phase);
        const render = () => {
          const phase = cover.dataset.phase;
          runway.style.setProperty("--progress", displayed + "%");
          cover.dataset.displayProgress = String(displayed);
          cover.dataset.mood = phase === "failed" || phase === "waiting" || phase === "updateFailed" ? "confused" : phase === "ready" ? "happy" : displayed >= 70 ? "excited" : displayed > 0 ? "working" : "sleepy";
          bar.setAttribute("aria-valuemin", "0");
          bar.setAttribute("aria-valuemax", "100");
          bar.setAttribute("aria-valuenow", String(displayed));
        };
        const advance = () => {
          const actual = Math.max(0, Math.min(99, Number(cover.dataset.progress ?? 0)));
          const simulated = nativeOpening ? 0 : 3 + 87 * (1 - Math.exp(-(performance.now() - started) / 5000));
          displayed = Math.max(displayed, actual, Math.round(simulated * 100) / 100);
          render();
        };
        const tick = () => {
          if (!cover.isConnected) return dispose();
          if (terminal()) return stop();
          advance();
          schedule();
        };
        const schedule = () => {
          if (nativeOpening || terminal() || displayed >= 90) return;
          if (reducedMotion.matches) timer = setTimeout(tick, 1000);
          else frame = requestAnimationFrame(tick);
        };
        const paint = () => {
          if (!cover.isConnected) return dispose();
          const problem = cover.dataset.problem;
          if (problem) cover.dataset.phase = "failed";
          const phase = cover.dataset.phase;
          if (terminal()) {
            stop();
            if (phase === "ready") displayed = 100;
            render();
          } else advance();
          const failed = phase === "failed" || phase === "updateFailed";
          if (failed) bar.removeAttribute("role");
          if (updateSteps.includes(phase)) {
            const updating = said.updating.replace("{next}", cover.dataset.next ?? "");
            const step = phase === "updateFailed" ? said.updateFailed.replace("{why}", cover.dataset.why ?? "") : said[phase];
            words.textContent = updating + " · " + step;
            bar.setAttribute("aria-label", updating);
            note.textContent = cover.dataset.newFarm === "true" ? said.keptNewFarm : said.kept;
            note.hidden = false;
            download.hidden = phase !== "updateFailed" || !cover.dataset.page;
            if (!download.hidden) {
              download.href = cover.dataset.page;
              download.textContent = said.download;
            }
          } else words.textContent = problem ? said.cannotStart.replace("{why}", problem) : said[phase] ?? said.waking;
          if (phase === "updateFailed") words.setAttribute("role", "alert");
          if (problem) {
            words.className = "problem";
            words.setAttribute("role", "alert");
          }
        };
        const observer = new MutationObserver(() => {
          if (!cover.isConnected) dispose();
        });
        observer.observe(document.body, { childList: true, subtree: true });
        cover.addEventListener("opening-update", paint);
        window.addEventListener("pagehide", dispose);
        const prefs = (() => {
          try { return JSON.parse(localStorage.getItem("vibevalley.prefs") ?? "{}") ?? {}; }
          catch { return {}; }
        })();
        const farm = /^\/(farm|tree)(\/|$)/.test(location.pathname) || (location.pathname === "/" && prefs.start === "farm");
        const dark = prefs.theme === "dark" || (prefs.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        cover.dataset.look = farm ? "farm" : "desk";
        cover.dataset.theme = dark ? "dark" : "light";
        if (location.protocol !== "file:") document.documentElement.dataset.theme = cover.dataset.theme;
        const hour = new Date().getHours();
        const scene = hour >= 5 && hour < 10 ? "morning" : hour >= 10 && hour < 18 ? "day" : "night";
        cover.dataset.scene = scene;
        cover.dataset.phase = "starting";
        // file:// resolves beside this page; nested server routes resolve from the root.
        const root = location.protocol === "file:" ? "" : "/";
        cover.querySelector(".scene").src = root + "brand/opening-" + scene + ".webp";
        cover.querySelector(".sprite").style.backgroundImage = 'url("' + root + 'brand/opening-sprite.webp")';
        const problem = location.pathname.endsWith("/opening.html") ? new URLSearchParams(location.search).get("problem") : null;
        if (problem) cover.dataset.problem = problem;
        paint();
        schedule();
      }
    </script>
    <!-- /opening -->
  </body>
</html>
