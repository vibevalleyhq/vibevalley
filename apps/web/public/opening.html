<!doctype html>
<!-- The opening markers are embedded in index.html by vite.config.ts. Electron also loads this file before its server starts. -->
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeValley</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- opening -->
    <style>
      /* These colors mirror the pixel tokens in style.css; this page also runs without the application stylesheet. */
      #opening {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: auto;
        background: #2b3320;
        color: #eedcb2;
        font: 12px "FusionPixel", "PingFang SC", sans-serif;
        user-select: none;
      }
      #opening::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 12px;
        border-top: 4px solid #567c31;
        background: #2f1f13;
      }
      #opening .column {
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        width: min(384px, 100%);
        padding: 32px;
        text-align: center;
      }
      #opening .face {
        width: 128px;
        height: 128px;
        image-rendering: pixelated;
      }
      #opening .name {
        margin: 20px 0 32px;
        font-size: 36px;
        line-height: 1;
        color: #faf1d9;
        text-shadow: 3px 3px 0 #2f1f13;
      }
      #opening .bar {
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
        width: min(256px, 100%);
        height: 16px;
        padding: 2px;
        border: 2px solid #2f1f13;
        background: #2f1f1399;
        box-shadow: 2px 2px 0 #3a2a1899;
      }
      #opening .fill {
        position: absolute;
        top: 2px;
        bottom: 2px;
        width: 30%;
        background: #74a046;
        animation: opening-walk 1.4s steps(14) infinite;
      }
      #opening .words,
      #opening .problem {
        margin-top: 16px;
        line-height: 2;
        color: #e2c995;
      }
      #opening .problem {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        width: 100%;
      }
      @keyframes opening-walk {
        from {
          left: -30%;
        }
        to {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #opening .fill {
          animation: none;
          left: 35%;
        }
      }
    </style>
    <div id="opening">
      <div class="column">
        <img class="face" alt="" width="128" height="128" />
        <span class="name">VibeValley</span>
        <div class="bar" role="progressbar"><div class="fill"></div></div>
        <span class="words" role="status"></span>
      </div>
    </div>
    <script>
      // Catalog text is substituted by vite.config.ts; Electron passes the locale in the file URL.
      const openingWords = "__OPENING_WORDS__";
      const openingLocale = document.documentElement.dataset.locale ?? new URLSearchParams(location.search).get("locale");
      const said = openingWords[openingLocale] ?? openingWords.zh;
      document.querySelector("#opening .bar").setAttribute("aria-label", said.label);
      document.querySelector("#opening .words").textContent = said.waking;
      const openingPrefs = (() => {
        try {
          return JSON.parse(localStorage.getItem("vibevalley.prefs") ?? "{}") ?? {};
        } catch {
          return {};
        }
      })();
      const openingFarm = /^\/(farm|tree)(\/|$)/.test(location.pathname) || (location.pathname === "/" && openingPrefs.start === "farm");
      const openingDark = openingPrefs.theme === "dark" || (openingPrefs.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      const openingCover = document.getElementById("opening");
      openingCover.dataset.look = openingFarm ? "farm" : "desk";
      openingCover.dataset.theme = openingDark ? "dark" : "light";
      if (location.protocol !== "file:") document.documentElement.dataset.theme = openingCover.dataset.theme;
      // Asset URLs must work both from Electron's file URL and from nested application routes.
      const openingAssets = location.protocol === "file:" ? "" : "/";
      document.querySelector("#opening .face").src = openingAssets + "icons/app-64.png";
      const openingFont = new FontFace("FusionPixel", `url("${openingAssets}fonts/fusion-pixel-12px-proportional-zh_hans.otf")`);
      document.fonts.add(openingFont);
      openingFont.load().catch(() => undefined);
    </script>
    <!-- /opening -->
    <script>
      const problem = new URLSearchParams(location.search).get("problem");
      if (problem) {
        document.querySelector("#opening .bar").remove();
        const words = document.querySelector("#opening .words");
        words.className = "problem";
        words.setAttribute("role", "alert");
        words.textContent = said.cannotStart.replace("{why}", problem);
      }
    </script>
  </body>
</html>
