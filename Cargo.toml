[workspace]
resolver = "3"
members = [
  "crates/protocol",
  "crates/rt",
  "crates/mcp",
  "crates/i18n",
  "crates/core",
  "crates/git",
  "crates/files",
  "crates/runtime",
  "crates/server",
  "crates/cli",
  "crates/rich",
  "crates/engines/onig",
  "crates/engines/pele",
  "crates/engines/shiki",
  "apps/mac",
  "apps/mac/crates/diorama",
  "apps/mac/crates/terminal",
  "apps/mac/crates/workspace",
  "xtask",
]
exclude = ["apps/mac/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
arc-swap = "1"
backon = "1"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
futures-util = { version = "0.3.34", features = ["sink"] }
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
imagesize = "0.15.0"
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "perf-inline"] }
loom = "0.7"
loro = { version = "1.18.0", default-features = false }
parking_lot = "0.12"
percent-encoding = "2.3.2"
png = "0.18.1"
quick-xml = "0.41.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
roxmltree = "0.21.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sea-orm = { version = "2.0.4", default-features = false, features = [
  "macros",
  "with-json",
  "with-uuid",
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "sqlite-use-returning-for-3_35",
] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlite-use-returning-for-3_35"] }
sea-query = { version = "1.0.2", default-features = false, features = ["backend-sqlite", "with-json", "with-uuid", "thread-safe"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "derive"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.20", features = ["rt", "io", "io-util", "codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "v7"] }
vibevalley-mcp = { path = "crates/mcp" }
vibevalley-rt = { path = "crates/rt" }
wgpu = "29.0.4"
which = "8.0.6"
zip = { version = "9.7.1", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.build-override]
opt-level = 0
debug = false

[profile.dev.package.gpui-fast]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.nsh-engine]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.vibevalley-pele]
opt-level = 2

[profile.release]
# Keep default unwinding (`panic = "unwind"`): nsh-core's SVG engine relies on catch_unwind.
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.alpha]
inherits = "release"
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
lto = false
codegen-units = 256
incremental = true
strip = "none"

[profile.loom]
inherits = "dev"
opt-level = 2
debug = false
incremental = true
