[workspace]
resolver = "3"
members = ["crates/*", "apps/mac"]
exclude = ["apps/mac/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
futures-util = { version = "0.3.34", features = ["sink"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = { version = "1.0.1", features = ["tz-system"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1.29.2", features = ["v4", "v7"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.build-override]
opt-level = 0
debug = false

[profile.dev.package.gpui-kit]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.nsh-engine]
opt-level = 2

[profile.dev.package.vibevalley-pixel]
opt-level = 3

[profile.release]
strip = "symbols"
