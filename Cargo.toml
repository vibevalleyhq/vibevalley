[workspace]
resolver = "3"
members = [
  "crates/protocol",
  "crates/i18n",
  "crates/core",
  "crates/git",
  "crates/files",
  "crates/runtime",
  "crates/server",
  "crates/cli",
  "crates/rich",
  "crates/engines/onig",
  "crates/engines/pele",
  "crates/engines/shiki",
  "apps/mac",
  "apps/mac/crates/pixel",
  "apps/mac/crates/terminal",
  "apps/mac/crates/workspace",
]
exclude = ["apps/mac/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.23.1"
flume = "0.12.0"
futures-util = { version = "0.3.34", features = ["sink"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "perf-inline"] }
pollster = "0.4.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
ureq = { version = "3.5.2", default-features = false, features = ["json"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "v7"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.build-override]
opt-level = 0
debug = false

[profile.dev.package.gpui-fast]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.nsh-engine]
opt-level = 2

[profile.dev.package.vibevalley-pixel]
opt-level = 3

[profile.release]
strip = "symbols"
