[workspace]
resolver = "3"
members = ["crates/*", "apps/mac"]
exclude = ["apps/mac/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
opt-level = 0
debug = false
