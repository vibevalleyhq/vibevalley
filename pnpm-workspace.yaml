# The workspace: the apps and the shared packages. site/ is a project of its own (its Astro brings its own Vite), with its
# own pnpm-workspace.yaml.
packages:
  - apps/*
  - packages/*

# Every version the workspace's packages use, written once: their package.json say "catalog:" (or "catalog:expo"). With
# catalogMode strict, pnpm add puts a new version here and writes "catalog:" there; scripts/catalog.test.ts refuses a
# version written by hand. vite is Vite+'s core everywhere: overrides below point every vite and vitest at these.
# The root and apps/web also name vite themselves, though they import only vite-plus: that is what gives vitest's
# @vitest/mocker and @vitest/browser (at the root) and the page's Solid plugin and its vitefu a vite for their peer.
# Without it pnpm leaves those peers unresolved (the lockfile shows them losing @voidzero-dev/vite-plus-core).
catalogMode: strict

catalog:
  "@agentclientprotocol/sdk": "2.0.0"
  "@axe-core/playwright": "^4.14.0"
  "@botiverse/oar": "0.69.0"
  "@earendil-works/pi-ai": "1.3.0"
  "@effect/platform-node": "4.0.5"
  "@effect/sql-pglite": "4.0.5"
  "@effect/vitest": "4.0.5"
  "@electric-sql/pglite": "^0.5.10"
  "@floating-ui/dom": "^1.8.0"
  "@larksuiteoapi/node-sdk": "^1.76.0"
  "@modelcontextprotocol/sdk": "^1.32.1"
  "@playwright/test": "^1.64.1"
  "@solidjs/vite-plugin": "3.0.0-next.50"
  "@solidjs/web": "2.0.0-rc.16"
  "@tailwindcss/vite": "^4.3.3"
  "@tanstack/solid-query": "6.0.0-rc.5"
  "@types/node": "^26.6.5"
  "@vitest/browser-playwright": "5.0.5"
  agora-agents: "2.12.0"
  agora-rtc-sdk-ng: "4.24.9"
  agora-token: "2.0.7"
  axe-core: "^4.14.0"
  effect: "4.0.5"
  electron: "^44.9.2"
  electron-builder: "26"
  esbuild: "^0.28.2"
  eslint-plugin-solid: "0.18.1"
  hast-util-to-dom: "^4.0.1"
  pixi.js: "^8.22.0"
  playwright: "^1.64.1"
  react-native-agora: "^4.6.4"
  reicon: "1.2.5"
  remark-gfm: "^4.0.1"
  remark-parse: "^11.0.0"
  remark-rehype: "^11.1.2"
  pele: ^1.12.0
  shiki: ^4.5.0
  solid-js: "2.0.0-rc.16"
  tailwindcss: "^4.3.3"
  tsx: "^4.23.15"
  typescript: "^7.0.2"
  unified: "^11.0.5"
  uqr: "^0.1.3"
  vite: "npm:@voidzero-dev/vite-plus-core@1.4.0"
  vite-plus: "1.4.0"
  vitest: "5.0.5"
  yaml: "^2.9.1"

# What the Expo SDK pins for apps/mobile, moved together when the SDK moves: `vp exec expo install --check` in apps/mobile
# says to what (its --fix would write the versions into package.json instead).
catalogs:
  expo:
    "@types/react": "~19.3.0"
    expo: "~58.0.16"
    expo-build-properties: "~58.0.11"
    expo-camera: "~58.0.11"
    expo-linking: "~58.0.13"
    expo-notifications: "~58.1.5"
    expo-secure-store: "~58.0.2"
    expo-status-bar: "~58.0.3"
    react: "19.3.0"
    react-native: "0.88.0"
    react-native-safe-area-context: "~5.10.1"
    react-native-webview: "14.0.1"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

# Vite+'s core stands in for vite, so a package asking for vite or vitest takes it whatever range it asks.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Install scripts: esbuild fetches its binary in its; the others have never been run and are not needed. (Electron has
# none: it downloads its binary the first time it runs.)
allowBuilds:
  esbuild: true
  "@google/genai": false
  electron-winstaller: false
  protobufjs: false

# The packages' files live once, in pnpm's global virtual store (~/Library/pnpm/store/…/links), and every checkout's
# node_modules only links to them: a helper's worktree installs in a few seconds and holds tens of files, not tens of
# thousands. The global store does not hoist, so a package whose types use one it does not declare gets it declared here.
enableGlobalVirtualStore: true

packageExtensions:
  # @solidjs/web's jsx.d.ts imports csstype's CSSProperties: without it every style={{…}} is a type error.
  "@solidjs/web":
    dependencies:
      csstype: "^3.2.3"
  # expo-camera's types import React's: without it CameraView is not a JSX component.
  expo-camera:
    dependencies:
      "@types/react": "~19.3.0"
