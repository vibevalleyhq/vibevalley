# All apps and shared packages use this workspace, catalog, and lockfile.
packages:
  - apps/*
  - packages/*

# Every version the workspace's packages use, written once: their package.json say "catalog:" (or "catalog:expo"). With
# catalogMode strict, pnpm add puts a new version here and writes "catalog:" there; scripts/catalog.test.ts refuses a
# version written by hand. vite is Vite+'s core everywhere: overrides below point every vite and vitest at these.
# The root and apps/web also name vite themselves, though they import only vite-plus: that is what gives vitest's
# @vitest/mocker and @vitest/browser (at the root) and the page's Solid plugin and its vitefu a vite for their peer.
# Without it pnpm leaves those peers unresolved (the lockfile shows them losing @voidzero-dev/vite-plus-core).
catalogMode: strict

catalog:
  "@types/opentype.js": "^1.3.10"
  motion: "^14.9.0"
  opentype.js: "^2.0.0"
  sharp: "0.35.5"
  subset-font: "^2.9.0"
  "@ai-sdk/provider": "4.0.36"
  ai: "7.0.164"
  "@formatjs/intl-getcanonicallocales": "3.3.0"
  "@formatjs/intl-locale": "5.4.2"
  "@formatjs/intl-pluralrules": "7.0.2"
  base64-js: "1.5.1"
  "@axe-core/playwright": "^4.14.0"
  "@botiverse/oar": "0.101.0"
  "@earendil-works/chord": "1.5.2"
  "@earendil-works/pi-ai": "1.5.2"
  "@earendil-works/pi-durable": "1.5.2"
