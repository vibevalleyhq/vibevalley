# All apps and shared packages use this workspace, catalog, and lockfile.
packages:
  - apps/*
  - packages/*
  - apps/mac/ui

# Every version the workspace's packages use, written once: their package.json say "catalog:". With catalogMode strict,
# pnpm add puts a new version here and writes "catalog:" there; scripts/audit/catalog.test.ts refuses a version written
# by hand. vite is Vite+'s core everywhere: overrides below point every vite and vitest at these.
# The root and apps/site also name vite themselves, though they import only vite-plus: that is what gives vitest's
# @vitest/mocker and @vitest/browser (at the root) and the site's Solid plugin and its vitefu a vite for their peer.
# Without it pnpm leaves those peers unresolved (the lockfile shows them losing @voidzero-dev/vite-plus-core).
catalogMode: strict

catalog:
  "@types/opentype.js": "^1.3.10"
  motion: "^14.9.0"
  opentype.js: "^2.0.0"
  sharp: "0.35.5"
  subset-font: "^2.9.0"
  "@playwright/test": "^1.64.1"
  "@solidjs/vite-plugin": "3.0.0-next.56"
  "@solidjs/web": "2.0.0-rc.21"
  "@types/node": "^26.6.6"
  reicon: "1.2.5"
  pinyin-pro: "3.29.5"
  pele: ^1.13.0
  solid-js: "2.0.0-rc.21"
  tsrs: "0.21.0-ts7.1.0-beta"
  typescript: "^7.0.2"
  uqr: "^0.1.3"
  vite: "npm:@voidzero-dev/vite-plus-core@1.5.0"
  vite-plus: "1.5.0"
  vitest: "5.1.0"
  yaml: "^2.9.1"
  knip: 6.44.1
  parse5: 8.1.0
  zod: ^4.6.7
  "@tailwindcss/vite": ^4.3.5
  tailwindcss: ^4.3.5

overrides:
  # The website uses only Motion's DOM entry, not its optional React adapters.
  "motion>react": "-"
  "motion>react-dom": "-"
  "framer-motion>react": "-"
  "framer-motion>react-dom": "-"
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # oxlint's type-aware lint and type check on tsrs instead of tsgolint (packages/tsrs/README.md).
  oxlint-tsgolint: "link:packages/tsrs"

# Vite+'s core stands in for vite, so a package asking for vite or vitest takes it whatever range it asks.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Install scripts: esbuild fetches its binary in its.
allowBuilds:
  esbuild: true

# The packages' files live once, in pnpm's global virtual store (~/Library/pnpm/store/…/links), and every checkout's
# node_modules only links to them: a helper's worktree installs in a few seconds and holds tens of files, not tens of
# thousands. The global store does not hoist, so a package whose types use one it does not declare gets it declared here.
enableGlobalVirtualStore: true

packageExtensions:
  # @solidjs/web's jsx.d.ts imports csstype's CSSProperties: without it every style={{…}} is a type error.
  "@solidjs/web":
    dependencies:
      csstype: "^3.2.3"
