  tailwindcss: ^4.3.5
  ws: ^8.22.2
  "@types/ws": ^8.18.2

# What the Expo SDK pins for apps/mobile, moved together when the SDK moves: `vp exec expo install --check` in apps/mobile
# says to what (its --fix would write the versions into package.json instead).
catalogs:
  expo:
    "@types/react": "~19.3.0"
    expo: "~58.0.23"
    expo-build-properties: "~58.0.12"
    expo-camera: "~58.0.14"
    expo-linking: "~58.0.16"
    expo-notifications: "~58.1.8"
    expo-secure-store: "~58.0.2"
    expo-status-bar: "~58.0.4"
    react: "19.3.0"
    react-native: "0.88.1"
    react-native-safe-area-context: "~5.11.1"
    react-native-webview: "14.0.1"

overrides:
  # The website uses only Motion's DOM entry, not its optional React adapters.
  "motion>react": "-"
  "motion>react-dom": "-"
  "framer-motion>react": "-"
  "framer-motion>react-dom": "-"
  "react-native-agora@4.6.4>base64-js": "catalog:"
  # One undici 8 for the server's dependencies: with two (oar's and Effect's), openai and pi-ai were installed once for
  # each, 33 MB more in the app. Electron's build tools keep their undici 6 and 7.
  "undici@8": 8.12.3
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # oxlint's type-aware lint and type check on tsrs instead of tsgolint (packages/tsrs/README.md).
  oxlint-tsgolint: "link:packages/tsrs"

# Vite+'s core stands in for vite, so a package asking for vite or vitest takes it whatever range it asks.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # oar's own pi-durable runtime is written against 1.4 and is not used: the server's runtime/durable.ts runs
    # pi-durable 1.5 itself (apps/server/src/modules/runtime/durable.ts). Drop these once oar's peer reaches 1.5.
    "@botiverse/oar>@earendil-works/pi-durable": "1.5.2"
    "@botiverse/oar>@earendil-works/chord": "1.5.2"

# Install scripts: esbuild fetches its binary in its; the others have never been run and are not needed. (Electron has
# none: it downloads its binary the first time it runs.)
allowBuilds:
  esbuild: true
  "@google/genai": false
  electron-winstaller: false
  protobufjs: false

# The packages' files live once, in pnpm's global virtual store (~/Library/pnpm/store/…/links), and every checkout's
# node_modules only links to them: a helper's worktree installs in a few seconds and holds tens of files, not tens of
# thousands. The global store does not hoist, so a package whose types use one it does not declare gets it declared here.
enableGlobalVirtualStore: true

packageExtensions:
  # Agora imports this at runtime from its React Native entry, but does not declare it.
  "react-native-agora@4.6.4":
    dependencies:
      base64-js: "*"
  # @solidjs/web's jsx.d.ts imports csstype's CSSProperties: without it every style={{…}} is a type error.
  "@solidjs/web":
    dependencies:
      csstype: "^3.2.3"
  # expo-camera's types import React's: without it CameraView is not a JSX component.
  expo-camera:
    dependencies:
      "@types/react": "~19.3.0"

