  music-metadata: "12.3.5"
  pixi.js: "^8.22.0"
  playwright: "^1.64.1"
  react-native-agora: "^4.6.4"
  reicon: "1.2.5"
  remark-gfm: "^4.0.1"
  remark-parse: "^11.0.0"
  remark-rehype: "^11.1.2"
  pinyin-pro: "3.29.5"
  pele: ^1.13.0
  shiki: ^4.6.0
  solid-js: "2.0.0-rc.21"
  tsrs: "0.21.0-ts7.1.0-beta"
  typescript: "^7.0.2"
  unified: "^11.0.5"
  uqr: "^0.1.3"
  vite: "npm:@voidzero-dev/vite-plus-core@1.5.0"
  vite-plus: "1.5.0"
  vitest: "5.1.0"
  yaml: "^2.9.1"
  knip: 6.44.1
  lightningcss: "1.33.0"
  parse5: 8.1.0
  undici: "8.12.3"
  zod: ^4.6.7
  "@hono/node-server": ^2.1.6
  hono: ^4.13.17
  pg: ^8.23.1
  "@types/pg": ^8.23.1
  commander: ^15.1.0
