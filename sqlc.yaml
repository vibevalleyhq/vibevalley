version: "2"
plugins:
  - name: sqlx
    process:
      cmd: ./scripts/gen/sqlc-rust/generate.ts
      format: json
    env: [PATH]
sql:
  - engine: sqlite
    schema: apps/mac/crates/workspace/sql/migrations
    queries: apps/mac/crates/workspace/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: apps/mac/crates/workspace/src/store/generated
  - engine: sqlite
    schema: crates/server/src/modules/content/attachment/sql/schema.sql
    queries: crates/server/src/modules/content/attachment/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/modules/content/attachment/generated
  - engine: sqlite
    schema: crates/runtime/src/agent/durable/schema.sql
    queries: crates/runtime/sql/durable
    codegen:
      - plugin: sqlx
        out: crates/runtime/src/agent/durable/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema: crates/server/src/modules/work/issue/sql/schema.sql
    queries: crates/server/src/modules/work/issue/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/modules/work/issue/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema:
      - crates/server/src/modules/work/session/sql/schema.sql
      - crates/runtime/src/agent/durable/schema.sql
    queries: crates/server/src/modules/work/session/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/modules/work/session/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema: crates/server/src/modules/team/memory/sql/schema.sql
    queries: crates/server/src/modules/team/memory/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/modules/team/memory/generated
  - engine: sqlite
    schema:
      - crates/server/src/modules/content/library/sql/schema.sql
      - crates/server/src/modules/content/attachment/sql/schema.sql
    queries: crates/server/src/modules/content/library/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/modules/content/library/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema: crates/server/src/modules/collab/connector/sql/schema.sql
    queries: crates/server/src/modules/collab/connector/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/modules/collab/connector/generated
  - engine: sqlite
    schema: crates/server/src/modules/content/pkm/sql/schema.sql
    queries: crates/server/src/modules/content/pkm/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/modules/content/pkm/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema:
      - crates/server/src/modules/work/issue/sql/schema.sql
      - crates/server/src/modules/collab/channel/sql/schema.sql
      - crates/server/src/modules/content/artifact/sql/schema.sql
    queries: crates/server/src/modules/content/artifact/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/modules/content/artifact/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema:
      - crates/server/src/modules/content/media/sql/inputs.sql
      - crates/server/src/modules/content/media/sql/jobs.sql
    queries: crates/server/src/modules/content/media/sql/queries.sql
    codegen:
