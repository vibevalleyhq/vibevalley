      - plugin: sqlx
        out: crates/server/src/db/generated
        options: { file: team_memory.rs }
  - engine: sqlite
    schema:
      - crates/server/src/modules/content/library/sql/schema.sql
      - crates/server/src/modules/content/attachment/sql/schema.sql
    queries: crates/server/src/db/queries/content_library.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/db/generated
        options: { file: content_library.rs, share_table_rows: true }
  - engine: sqlite
    schema: crates/server/src/modules/collab/connector/sql/schema.sql
    queries: crates/server/src/db/queries/collab_connector.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/db/generated
        options: { file: collab_connector.rs }
  - engine: sqlite
    schema: crates/server/src/modules/content/pkm/sql/schema.sql
    queries: crates/server/src/db/queries/content_pkm.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/db/generated
        options: { file: content_pkm.rs, share_table_rows: true }
  - engine: sqlite
    schema:
      - crates/server/src/modules/work/issue/sql/schema.sql
      - crates/server/src/modules/collab/channel/sql/schema.sql
      - crates/server/src/modules/content/artifact/sql/schema.sql
    queries: crates/server/src/db/queries/content_artifact.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/db/generated
        options: { file: content_artifact.rs, share_table_rows: true }
  - engine: sqlite
    schema:
      - crates/server/src/modules/content/media/sql/inputs.sql
