    queries: crates/server/src/modules/collab/channel/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/modules/collab/channel/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema:
      - crates/server/src/modules/work/issue/sql/schema.sql
