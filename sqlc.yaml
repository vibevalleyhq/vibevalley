version: "2"
plugins:
  - name: sqlx
    process:
      cmd: ./scripts/gen/sqlc-rust/generate.ts
      format: json
    env: [PATH]
sql:
  - engine: sqlite
    schema: crates/vibevalley-workspace/sql/migrations
    queries: crates/vibevalley-workspace/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/vibevalley-workspace/src/store/generated
  - engine: sqlite
    schema: crates/vibevalley-server/src/modules/attachment/sql/schema.sql
    queries: crates/vibevalley-server/src/modules/attachment/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/vibevalley-server/src/modules/attachment/generated
  - engine: sqlite
    schema: crates/vibevalley-durable/src/schema.sql
    queries: crates/vibevalley-durable/sql
    codegen:
      - plugin: sqlx
        out: crates/vibevalley-durable/src/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema: crates/vibevalley-server/src/modules/issue/sql/schema.sql
    queries: crates/vibevalley-server/src/modules/issue/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: crates/vibevalley-server/src/modules/issue/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema:
      - crates/vibevalley-server/src/modules/session/sql/schema.sql
      - crates/vibevalley-durable/src/schema.sql
    queries: crates/vibevalley-server/src/modules/session/sql/queries.sql
    codegen:
