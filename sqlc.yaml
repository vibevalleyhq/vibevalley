version: "2"
plugins:
  - name: sqlx
    process:
      cmd: ./scripts/gen/sqlc-rust/generate.ts
      format: json
    env: [PATH]
sql:
  - engine: sqlite
    schema: apps/mac/crates/workspace/sql/migrations
    queries: apps/mac/crates/workspace/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: apps/mac/crates/workspace/src/store/generated
  - engine: sqlite
    schema: crates/server/src/modules/content/attachment/sql/schema.sql
    queries: crates/server/src/db/queries/content_attachment.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/db/generated
        options: { file: content_attachment.rs }
  - engine: sqlite
    schema: crates/runtime/src/agent/durable/schema.sql
    queries: crates/runtime/sql/durable
    codegen:
      - plugin: sqlx
        out: crates/runtime/src/agent/durable/generated
        options: { share_table_rows: true }
  - engine: sqlite
    schema: crates/server/src/modules/work/issue/sql/schema.sql
    queries: crates/server/src/db/queries/work_issue.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/db/generated
        options: { file: work_issue.rs, share_table_rows: true }
  - engine: sqlite
    schema:
      - crates/server/src/modules/work/session/sql/schema.sql
      - crates/runtime/src/agent/durable/schema.sql
    queries: crates/server/src/db/queries/work_session.sql
    codegen:
      - plugin: sqlx
        out: crates/server/src/db/generated
        options: { file: work_session.rs, share_table_rows: true }
  - engine: sqlite
    schema: crates/server/src/modules/team/memory/sql/schema.sql
    queries: crates/server/src/db/queries/team_memory.sql
