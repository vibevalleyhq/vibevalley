version: "2"
plugins:
  - name: sqlx
    process:
      cmd: ./scripts/gen/sqlc-rust/generate.ts
      format: json
    env: [PATH]
sql:
  - engine: sqlite
    schema: apps/mac/crates/workspace/sql/migrations
    queries: apps/mac/crates/workspace/sql/queries.sql
    codegen:
      - plugin: sqlx
        out: apps/mac/crates/workspace/src/store/generated
