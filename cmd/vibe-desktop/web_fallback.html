<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VibeValley Workbench</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: light-dark(#fcfcfb, #151413);
      color: light-dark(#1c1917, #ecebe8);
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    main { max-width: 480px; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; opacity: 0.78; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>VibeValley</h1>
    <p>Embedded desktop shell ready. Pass <code>--web-dist</code> to serve built workbench assets.</p>
  </main>
</body>
</html>
