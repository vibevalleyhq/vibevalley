# Workspace-wide Clippy semantic bans (zero-regression baseline).
# Tighten this file immediately after each refactor wave zeroes out a category
# (`cargo xtask diagnose --json` + `.agents/skills/vv-arch-loop/SKILL.md`).

disallowed-methods = [
  { path = "pollster::block_on", reason = "Use the process-shared Tokio runtime (`vibevalley_runtime::rt`) or async code; `pollster` is banned." },
  { path = "futures::executor::block_on", reason = "Use the process-shared Tokio runtime (`vibevalley_runtime::rt`) instead of alternate blocking executors." },
  { path = "futures_executor::block_on", reason = "Use the process-shared Tokio runtime (`vibevalley_runtime::rt`) instead of alternate blocking executors." },
  { path = "smol::block_on", reason = "Use the process-shared Tokio runtime (`vibevalley_runtime::rt`) instead of alternate blocking executors." },
  { path = "async_std::task::block_on", reason = "Use the process-shared Tokio runtime (`vibevalley_runtime::rt`) instead of alternate blocking executors." },
  { path = "tokio::runtime::Runtime::new", reason = "Reuse `vibevalley_runtime::rt::handle()` instead of constructing ad-hoc Tokio runtimes." },
  { path = "std::process::abort", reason = "Return typed errors or propagate graceful shutdown instead of aborting the process." },
  { path = "tokio::task::block_in_place", reason = "Keep `block_in_place` restricted to `crates/runtime/src/rt.rs`." },
  { path = "std::thread::sleep", reason = "Use `tokio::time::sleep` in async code; blocking OS boundaries must opt in with explicit `#[allow(clippy::disallowed_methods, reason = ...)]`." },
  { path = "flume::unbounded", reason = "Use `tokio::sync` channels (`mpsc`, `broadcast`, `watch`, `oneshot`) or `std::sync::mpsc`; `flume` is banned workspace-wide." },
  { path = "flume::bounded", reason = "Use `tokio::sync` channels (`mpsc`, `broadcast`, `watch`, `oneshot`) or `std::sync::mpsc`; `flume` is banned workspace-wide." },
]

disallowed-types = [
  { path = "std::sync::Condvar", reason = "Use `tokio::sync::Notify` / `watch` / `mpsc` or `std::thread::park` instead of blocking condvars." },
  { path = "flume::Sender", reason = "Use `tokio::sync` or `std::sync::mpsc` channel senders; `flume` is banned workspace-wide." },
  { path = "flume::Receiver", reason = "Use `tokio::sync` or `std::sync::mpsc` channel receivers; `flume` is banned workspace-wide." },
]
