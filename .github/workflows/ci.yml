# The checks a pull request must pass before it merges into main (docs/development.md#分支提交和-pr).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned by commit, its version in a comment (Dependabot keeps both current: .github/dependabot.yml); each
# job has a timeout, so a hang ends in minutes rather than GitHub's six hours.
# The token reads the repository and nothing else: no job pushes, comments or releases.
permissions:
  contents: read

env:
  # Hooks are for people's clones; CI runs the same checks itself.
  VP_GIT_HOOKS: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No job pushes, so the token is not left in the checkout's git config. Two commits deep: a pull request's merge
      # commit and its first parent, the base scripts/release/regression.ts compares it with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 2 }
      # The Node of .node-version, Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      # @v1 lags behind (no cache-toolchain).
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
      # Vite Task's results from earlier runs (after install, which may touch node_modules): a task whose inputs did not
      # change replays. The key has this job (and shard) so jobs do not take each other's; each run saves a new entry.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-
      - name: pull request title
        if: github.event_name == 'pull_request'
        # Squash merging makes the title the commit's subject. Passed through the environment, never into the shell.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: vpx scripts/docs/commit-msg.ts --title "$TITLE"
      - name: pull request body and branch
        # Dependabot writes its own body (release notes) and branch name; its titles pass the title check above.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        # The body becomes the squashed commit's message. Editing the title or body does not run CI again: vv-pr checks
        # them once more before merging.
        env:
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: vpx scripts/docs/commit-msg.ts --body "$BODY" && vpx scripts/docs/commit-msg.ts --branch "$BRANCH"
      - name: the contract this change touches
        # For the reviewer: the protocol, schema, and service interface lines it changes, in the summary.
        if: github.event_name == 'pull_request'
        run: vpx scripts/release/contract-diff.ts --base HEAD^1 >> "$GITHUB_STEP_SUMMARY"
      - name: regression tests
        # A pull request that removes or changes a test named "regression: …" names it in its body, and a fix adds one
        # (scripts/release/regression.ts). HEAD^1 is the base the merge commit was made on.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: vpx scripts/release/regression.ts --base HEAD^1 --branch "$BRANCH" --body "$BODY"
      # A warning fails too: none are let in to pile up.
      - run: vp check --deny-warnings
      - run: vp run docs:verify
      - run: vp run scripts:test
      - run: vp run deadcode
      # The TS packages' tests (the native views and the generators use them).
      - run: vp run --filter @vibevalley/protocol --filter @vibevalley/bridge --filter @vibevalley/i18n --filter @vibevalley/testkit --filter @vibevalley/pkm --filter @vibevalley/artifact test

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  # The check main requires for the server: the server and the command line are the Rust workspace's (the rust job).
  server:
    name: server
    needs: rust
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.rust.result }}" = success

  # The checks main still requires under the names of the deleted browser pages and Electron shell: the pages are the
  # native app's now, type-checked and bundled by the rust job (mac:check).
  web:
    name: web
    needs: rust
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.rust.result }}" = success

  desktop:
    name: desktop
    needs: rust
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.rust.result }}" = success

  rust:
    name: rust
    # The native app is macOS only (GPUI on Metal); the server crates build there too.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # No job pushes, so the token is not left in the checkout's git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The Node of .node-version and vp install: the protocol generator imports packages/protocol.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
      # rustup reads rust-toolchain.toml; libghostty-vt builds with Zig.
      - run: rustup show active-toolchain && brew install zig
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - run: vp run nsh:install
      - run: vp run protocol:check
      - run: vp run rust:check
      - run: vp run mac:check
      - name: Save cargo cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No job pushes, so the token is not left in the checkout's git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The Node of .node-version, Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      # @v1 lags behind (no cache-toolchain).
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
      - run: vp run site:check && vp run site:build
