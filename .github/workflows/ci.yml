# The checks a pull request must pass before it merges into main (docs/development.md#分支提交和-pr).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned by commit, its version in a comment (Dependabot keeps both current: .github/dependabot.yml); each
# job has a timeout, so a hang ends in minutes rather than GitHub's six hours.
# The token reads the repository and nothing else: no job pushes, comments or releases.
permissions:
  contents: read

env:
  # Hooks are for people's clones; CI runs the same checks itself.
  VP_GIT_HOOKS: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Two commits deep: a pull request's merge commit and its first parent, the base regression.ts compares it with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: ./.github/actions/setup
      - name: pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: vpx scripts/docs/commit-msg.ts --title "$TITLE"
      - name: pull request body and branch
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: vpx scripts/docs/commit-msg.ts --body "$BODY" && vpx scripts/docs/commit-msg.ts --branch "$BRANCH"
      - name: the contract this change touches
        if: github.event_name == 'pull_request'
        run: vpx scripts/release/contract-diff.ts --base HEAD^1 >> "$GITHUB_STEP_SUMMARY"
      - name: regression tests
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: vpx scripts/release/regression.ts --base HEAD^1 --branch "$BRANCH" --body "$BODY"
      - run: vp check --deny-warnings
      - run: vp run docs:verify
      - run: vp run scripts:test
      - run: vp run practice:check
      - run: vp run health:verify
      - run: vp run deadcode

  server-tests:
    name: server ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { shard: "${{ matrix.shard }}" }
      - if: matrix.shard == 1
        run: vp run --filter @vibevalley/server db:check
      - if: matrix.shard == 1
        run: vp run server:packages
      - run: vp run --filter @vibevalley/server test --shard=${{ matrix.shard }}/3

  # The one check main requires for the server: it passes only when every shard did.
  server:
    name: server
    needs: server-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: test "${{ needs.server-tests.result }}" = success

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: node_modules/.bin/playwright install --with-deps chromium
        working-directory: packages/base-ui
      - run: vp run web:test

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: xvfb-run -a vp run desktop:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: desktop-test-results, path: apps/desktop/test-results, retention-days: 7 }

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: vp run site:check && vp run site:build
