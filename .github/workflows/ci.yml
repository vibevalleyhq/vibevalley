# The checks a pull request must pass before it merges into main (docs/development.md#分支提交和-pr).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hooks are for people's clones; CI runs the same checks itself.
  VP_GIT_HOOKS: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm's version is package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pull request title
        if: github.event_name == 'pull_request'
        # Squash merging makes the title the commit's subject. Passed through the environment, never into the shell.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: pnpm exec tsx scripts/commit-msg.ts --title "$TITLE"
      - run: pnpm run check
      - run: pnpm run docs:verify
      - run: pnpm run scripts:test

  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm's version is package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: pnpm install --frozen-lockfile
      # server:check without db:check: effect-sqlc (the generator) is not published, so only a clone with ../effect-sqlc
      # can tell whether db/generated is current. The rest runs against the committed db/generated.
      - run: pnpm run test
        working-directory: packages/protocol
      - run: pnpm run check && pnpm run test
        working-directory: apps/server

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm's version is package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: pnpm install --frozen-lockfile
      - run: pnpm run web:check
      # Only the page's rule tests: the Playwright suite runs on the owner's machine (cd apps/web && pnpm run test).
      - run: pnpm run test:rules
        working-directory: apps/web

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm's version is package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm run desktop:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: desktop-test-results, path: apps/desktop/test-results, retention-days: 7 }

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm's version is package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm run site:check && pnpm run site:build
