# The checks a pull request must pass before it merges into main (docs/development.md#分支提交和-pr).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned by commit, its version in a comment (Dependabot keeps both current: .github/dependabot.yml); each
# job has a timeout, so a hang ends in minutes rather than GitHub's six hours.
# The token reads the repository and nothing else: no job pushes, comments or releases.
permissions:
  contents: read

env:
  # Hooks are for people's clones; CI runs the same checks itself.
  VP_GIT_HOOKS: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No job pushes, so the token is not left in the checkout's git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The Node of .node-version, Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      # @v1 lags behind (no cache-toolchain).
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
      # Vite Task's results from earlier runs (after install, which may touch node_modules): a task whose inputs did not
      # change replays. The key has this job (and shard) so jobs do not take each other's; each run saves a new entry.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-
      - name: pull request title
        if: github.event_name == 'pull_request'
        # Squash merging makes the title the commit's subject. Passed through the environment, never into the shell.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: vpx scripts/commit-msg.ts --title "$TITLE"
      - name: pull request body and branch
        # Dependabot writes its own body (release notes) and branch name; its titles pass the title check above.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        # The body becomes the squashed commit's message. Editing the title or body does not run CI again: vv-pr checks
        # them once more before merging.
        env:
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: vpx scripts/commit-msg.ts --body "$BODY" && vpx scripts/commit-msg.ts --branch "$BRANCH"
      # A warning fails too: none are let in to pile up.
      - run: vp check --deny-warnings
      - run: vp run docs:verify
      - run: vp run scripts:test
      - run: vp run health:verify

      # The server's tests in three parts at once; the types are the check job's (vp check covers every package).
      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  server-tests:
    name: server ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # No job pushes, so the token is not left in the checkout's git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The Node of .node-version, Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      # @v1 lags behind (no cache-toolchain).
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
      # Vite Task's results from earlier runs (after install, which may touch node_modules): a task whose inputs did not
      # change replays. The key has this job (and shard) so jobs do not take each other's; each run saves a new entry.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # server:check without db:check: effect-sqlc (the generator) is not published, so only a clone with ../effect-sqlc
      # can tell whether db/generated is current. The rest runs against the committed db/generated.
      - if: matrix.shard == 1
        run: vp run --filter @vibevalley/protocol --filter @vibevalley/testkit --filter @vibevalley/ai --filter @vibevalley/agent test
      # The test task with the shard as its argument: cached per shard.
      - run: vp run --filter @vibevalley/server test --shard=${{ matrix.shard }}/3

      # The one check main requires for the server: it passes only when every part did.
      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  server:
    name: server
    needs: server-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: test "${{ needs.server-tests.result }}" = success

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No job pushes, so the token is not left in the checkout's git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The Node of .node-version, Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      # @v1 lags behind (no cache-toolchain).
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
      # Vite Task's results from earlier runs (after install, which may touch node_modules): a task whose inputs did not
      # change replays. The key has this job (and shard) so jobs do not take each other's; each run saves a new entry.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # The page's Playwright suite (e2e) runs on the owner's machine: vp run --filter @vibevalley/web e2e.
      # @vibevalley/base-ui's tests run in headless Chromium (vitest's browser mode).
      - run: node_modules/.bin/playwright install --with-deps chromium
        working-directory: packages/base-ui
      - run: vp run web:test
      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No job pushes, so the token is not left in the checkout's git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The Node of .node-version, Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      # @v1 lags behind (no cache-toolchain).
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
      # Vite Task's results from earlier runs (after install, which may touch node_modules): a task whose inputs did not
      # change replays. The key has this job (and shard) so jobs do not take each other's; each run saves a new entry.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-
      - run: xvfb-run -a vp run desktop:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: desktop-test-results, path: apps/desktop/test-results, retention-days: 7 }
      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  # The island at the notch (apps/island) is Swift, built and tested on macOS: the desktop job above runs on Linux, where
  # the app goes without it.
  island:
    name: island
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # No job pushes, so the token is not left in the checkout's git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: swift test --package-path apps/island
      - run: swift build -c release --package-path apps/island

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No job pushes, so the token is not left in the checkout's git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The Node of .node-version, Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      # @v1 lags behind (no cache-toolchain).
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
      - run: vp run site:check && vp run site:build
