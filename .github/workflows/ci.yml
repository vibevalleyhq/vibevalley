# The checks a pull request must pass before it merges into main (docs/development.md#分支提交和-pr).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hooks are for people's clones; CI runs the same checks itself.
  VP_GIT_HOOKS: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node, then Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      - uses: voidzero-dev/setup-vp@v1
        with: { node-version: 24, cache: true }
      - name: pull request title
        if: github.event_name == 'pull_request'
        # Squash merging makes the title the commit's subject. Passed through the environment, never into the shell.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: vpx scripts/commit-msg.ts --title "$TITLE"
      - name: pull request body and branch
        if: github.event_name == 'pull_request'
        # The body becomes the squashed commit's message. Editing the title or body does not run CI again: vv-pr checks
        # them once more before merging.
        env:
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: vpx scripts/commit-msg.ts --body "$BODY" && vpx scripts/commit-msg.ts --branch "$BRANCH"
      - run: vp check
      - run: vp run docs:verify
      - run: vp run scripts:test

  # The server's tests in three parts at once; the types are the check job's (vp check covers every package).
  server-tests:
    name: server ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      # Node, then Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      - uses: voidzero-dev/setup-vp@v1
        with: { node-version: 24, cache: true }
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # server:check without db:check: effect-sqlc (the generator) is not published, so only a clone with ../effect-sqlc
      # can tell whether db/generated is current. The rest runs against the committed db/generated.
      - if: matrix.shard == 1
        run: vp run --filter @vibevalley/protocol test
      - run: vp test run --shard=${{ matrix.shard }}/3
        working-directory: apps/server

  # The one check main requires for the server: it passes only when every part did.
  server:
    name: server
    needs: server-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.server-tests.result }}" = success

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node, then Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      - uses: voidzero-dev/setup-vp@v1
        with: { node-version: 24, cache: true }
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # web:check without its vp check, which the check job runs. The page's Playwright suite (e2e) runs on the owner's
      # machine: vp run --filter vibevalley-web e2e.
      - run: vp run --filter @vibevalley/engine --filter @vibevalley/host --filter vibevalley-mobile --filter vibevalley-web test
      - run: vp run --filter vibevalley-web build

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node, then Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      - uses: voidzero-dev/setup-vp@v1
        with: { node-version: 24, cache: true }
      - run: xvfb-run -a vp run desktop:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: desktop-test-results, path: apps/desktop/test-results, retention-days: 7 }

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node, then Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
      - uses: voidzero-dev/setup-vp@v1
        with: { node-version: 24, cache: true }
      - run: vp run site:check && vp run site:build
