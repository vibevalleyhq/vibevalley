# A version tag (v0.2.0) builds the macOS app bundle, DMG, update ZIP, and manifest and puts them in a draft release.
# The draft is published by hand once someone has looked at it; until then the app's latest/download does not see it.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

# Only this workflow writes: it makes the draft release and uploads its files.
permissions:
  contents: write

env:
  VP_GIT_HOOKS: "0"

jobs:
  mac:
    name: mac
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # The whole history and its tags: the release's notes are the pull requests since the tag before.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - id: v
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: vp run package:mac
        env:
          VIBEVALLEY_RELEASE_VERSION: ${{ steps.v.outputs.version }}
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          jq -r 'if (.notes | length) > 0 then .notes | map("- " + .) | join("\n") else "- Release v" + .version end' dist/release.json > "$RUNNER_TEMP/notes.md"
          shopt -s nullglob
          assets=(
            dist/VibeValley-"$version"-*.dmg
            dist/VibeValley-"$version"-*.zip
            dist/release.json
          )
          if [ "${#assets[@]}" -lt 3 ]; then
            echo "Expected dmg, zip, and release.json in dist/, got: ${assets[*]}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "VibeValley $version" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            gh release create "$TAG" --draft --verify-tag --title "VibeValley $version" --notes-file "$RUNNER_TEMP/notes.md" "${assets[@]}"
          fi
