name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

# Only this workflow writes: it makes the draft release and uploads its files.
permissions:
  contents: write

env:
  VP_GIT_HOOKS: "0"

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  mac:
    name: mac
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # The whole history and its tags: the release's notes are the pull requests since the tag before.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
      - name: Require release signing configuration
        env:
          SIGN_IDENTITY: ${{ vars.VIBEVALLEY_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ vars.VIBEVALLEY_NOTARY_PROFILE }}
        run: |
          if [ "$(uname -m)" != arm64 ]; then
            echo "The published Mac build requires an Apple silicon runner." >&2
            exit 1
          fi
          if [ -z "$SIGN_IDENTITY" ] || [ -z "$NOTARY_PROFILE" ]; then
            echo 'Release signing is not configured. Fix: provision a Developer ID identity and notary profile before enabling release packaging.' >&2
            exit 1
          fi
      - run: rustup show && brew install zig
      - run: vp run nsh:install
      - run: vp run package:mac --version "${TAG#v}"
        env:
          TAG: ${{ github.ref_name }}
          VIBEVALLEY_SIGN_IDENTITY: ${{ vars.VIBEVALLEY_SIGN_IDENTITY }}
          VIBEVALLEY_NOTARY_PROFILE: ${{ vars.VIBEVALLEY_NOTARY_PROFILE }}
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          stem="VibeValley-${version}-arm64"
          jq -e --arg version "$version" --arg zip "$stem.zip" '.version == $version and (.builds | length == 1) and .builds[0].arch == "arm64" and .builds[0].file == $zip' apps/mac/dist/release.json >/dev/null
          jq -r '.notes | map("- " + .) | join("\n")' apps/mac/dist/release.json > notes.md
          gh release create "$TAG" --draft --verify-tag --title "VibeValley $version" --notes-file notes.md \
            "apps/mac/dist/$stem.dmg" "apps/mac/dist/$stem.zip" apps/mac/dist/release.json
