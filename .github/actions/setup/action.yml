name: setup
description: Install Node, Vite+, Go, sqlc, workspace dependencies, and restore/save the Vite Task cache

inputs:
  shard:
    description: Optional shard suffix to isolate Vite Task caches across matrix shards
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The Node of .node-version, Vite+ with the pnpm of package.json's packageManager, then vp install (frozen on CI).
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with: { node-version-file: .node-version, cache: true, cache-toolchain: true }
    # Restores after install and saves automatically in its post hook when the job succeeds.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ inputs.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ inputs.shard }}-
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Install sqlc v1.31.1
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)" in
          Linux) os="linux" ;;
          Darwin) os="darwin" ;;
          *) echo "Unsupported OS for sqlc: $(uname -s)" >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) arch="amd64" ;;
          aarch64|arm64) arch="arm64" ;;
          *) echo "Unsupported arch for sqlc: $(uname -m)" >&2; exit 1 ;;
        esac
        sqlc_ver="1.31.1"
        sqlc_dir="$RUNNER_TEMP/sqlc-bin"
        archive="sqlc_${sqlc_ver}_${os}_${arch}.tar.gz"
        mkdir -p "$sqlc_dir"
        if ! curl -fsSL "https://downloads.sqlc.dev/${archive}" -o "$RUNNER_TEMP/${archive}"; then
          curl -fsSL "https://github.com/sqlc-dev/sqlc/releases/download/v${sqlc_ver}/${archive}" -o "$RUNNER_TEMP/${archive}"
        fi
        tar -xzf "$RUNNER_TEMP/${archive}" -C "$sqlc_dir" sqlc
        chmod +x "$sqlc_dir/sqlc"
        rm -f "$RUNNER_TEMP/${archive}"
        echo "$sqlc_dir" >> "$GITHUB_PATH"
        PATH="$sqlc_dir:$PATH"
        go version && sqlc version
    - shell: bash
      run: git config --global user.name ci && git config --global user.email ci@example.com
