[package]
name = "vibevalley-machine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VibeValley execution-layer Machine abstraction, lock-free MachineRegistry, remote OAR proxy, and ephemeral container sandboxes"

[features]
default = []
# Experimental ephemeral container sandbox adapters (Docker / Apple Containers), pending server orchestration wiring.
sandbox = []
# Test-only model checking (cargo xtask loom); never enable in release binaries.
loom = ["dep:loom", "vibevalley-kit/loom"]

[dependencies]
arc-swap = { workspace = true }
loom = { workspace = true, optional = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
uuid = { workspace = true }
vibevalley-kit = { workspace = true }
vibevalley-oar = { workspace = true }
vibevalley-protocol = { version = "0.1.0", path = "../protocol" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
