[package]
name = "vibevalley-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VibeValley agent runtimes facade re-exporting vibevalley-kit::rt, vibevalley-oar, vibevalley-machine, and optional vibevalley-agent"

[[example]]
name = "commit_latency"
required-features = ["agent"]

[[test]]
name = "codemode_parity"
required-features = ["agent"]

[[test]]
name = "crash_recovery"
required-features = ["agent"]

[[test]]
name = "durable_parity"
required-features = ["agent"]

[[test]]
name = "eval_harness"
required-features = ["agent"]

[[test]]
name = "mcp"
required-features = ["agent"]

[[test]]
name = "oar_codemode"
required-features = ["agent"]

[[test]]
name = "runtime"
required-features = ["agent"]

[[test]]
name = "storage_conformance"
required-features = ["agent"]

[features]
default = ["agent"]
# Experimental ephemeral container sandbox adapters (Docker / Apple Containers), pending server orchestration wiring.
sandbox = ["vibevalley-machine/sandbox"]
agent = ["dep:vibevalley-agent"]
postgres = ["agent", "vibevalley-agent/postgres"]
loom = ["vibevalley-kit/loom", "vibevalley-oar/loom", "vibevalley-machine/loom"] # Test-only model checking (cargo xtask loom); never enable in release binaries.

[dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
vibevalley-agent = { workspace = true, optional = true }
vibevalley-kit = { workspace = true }
vibevalley-machine = { workspace = true }
vibevalley-oar = { workspace = true }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = { workspace = true }
jiff = { workspace = true }
nix = { version = "0.32.0", features = ["signal", "process"] }
parking_lot = { workspace = true }
proptest = "1.12.0"
reqwest = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true }
uuid = { workspace = true }
vibevalley-git = { version = "0.1.0", path = "../git" }
vibevalley-mcp = { workspace = true }
vibevalley-protocol = { version = "0.1.0", path = "../protocol" }
