[package]
name = "vibevalley-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VibeValley agent runtimes: external CLI/ACP engines (oar) and built-in DeepSeek harness (agent)"

[features]
loom = ["dep:loom"] # Test-only model checking (cargo xtask loom); never enable in release binaries.

[dependencies]
agent-client-protocol = "5.2.0"
arc-swap = { workspace = true }
backon = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
globset = "0.4.21"
ignore = "0.4.34"
jiff = { workspace = true }
loom = { workspace = true, optional = true }
nix = { version = "0.32.0", features = ["signal", "process"] }
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_parser = "0.159.0"
oxc_span = "0.159.0"
parking_lot = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rquickjs = { package = "quickjs-jit", version = "0.14.2" }
rustls = { workspace = true }
schemars = "1.2.3"
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util = { workspace = true }
uuid = { workspace = true }
vibevalley-git = { version = "0.1.0", path = "../git" }
vibevalley-mcp = { path = "../mcp" }
vibevalley-protocol = { version = "0.1.0", path = "../protocol" }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
proptest = "1.12.0"
tokio = { workspace = true, features = ["test-util"] }
