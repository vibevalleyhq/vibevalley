[package]
name = "vibevalley-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vibevalley"
path = "src/main.rs"

[[bin]]
name = "vibevalley-eval"
path = "src/bin/vibevalley_eval.rs"
required-features = ["eval"]

[[test]]
name = "eval"
path = "tests/eval.rs"
required-features = ["eval"]

[features]
default = []
eval = ["dep:vibevalley-runtime"]

[dependencies]
base64 = { workspace = true }
clap = { version = "4.6.7", features = ["derive", "string"] }
jiff = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vibevalley-core = { path = "../core", default-features = false }
vibevalley-protocol = { path = "../protocol" }
vibevalley-runtime = { path = "../runtime", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
vibevalley-runtime = { path = "../runtime" }
vibevalley-server = { path = "../server" }
