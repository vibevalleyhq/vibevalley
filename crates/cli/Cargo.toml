[package]
name = "vibevalley-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vibevalley"
path = "src/main.rs"

[[bin]]
name = "vibevalley-eval"
path = "src/bin/vibevalley_eval.rs"
required-features = ["eval"]

[[test]]
name = "eval"
path = "tests/eval.rs"
required-features = ["eval"]

[features]
default = []
eval = ["vibevalley-runtime/agent"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = { workspace = true }
clap = { version = "4.6.7", features = ["derive", "string"] }
futures-util = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vibevalley-core = { path = "../core", default-features = false }
vibevalley-git = { path = "../git" }
vibevalley-mcp = { workspace = true }
vibevalley-protocol = { path = "../protocol" }
vibevalley-runtime = { path = "../runtime", default-features = false }
which = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
vibevalley-server = { path = "../server", features = ["fake"] }
