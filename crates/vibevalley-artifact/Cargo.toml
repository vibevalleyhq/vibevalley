[package]
name = "vibevalley-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VibeValley's packages/artifact: block ops, Markdown in and out, the HTML check, words edited in a page, the shell"

[dependencies]
vibevalley-core = { version = "0.1.0", path = "../vibevalley-core" }
vibevalley-i18n = { version = "0.1.0", path = "../vibevalley-i18n" }
vibevalley-protocol = { version = "0.1.0", path = "../vibevalley-protocol" }
htmlize = { version = "1.1.0", features = ["unescape"] }
lol_html = "3.0.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
