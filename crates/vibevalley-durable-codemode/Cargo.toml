[package]
name = "vibevalley-durable-codemode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vibevalley-durable = { version = "0.1.0", path = "../vibevalley-durable" }
rquickjs = { package = "quickjs-jit", version = "0.14.2" }
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
