[package]
name = "vibevalley-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vibevalley-chord = { version = "0.1.0", path = "../vibevalley-chord" }
axum = { version = "0.8.9", features = ["ws"] }
vibevalley-bridge = { version = "0.1.0", path = "../vibevalley-bridge" }
vibevalley-protocol = { version = "0.1.0", path = "../vibevalley-protocol" }
vibevalley-server-api = { version = "0.1.0", path = "../vibevalley-server-api" }
flume = "0.12.0"
futures-util = { workspace = true }
regex = "1.13.1"
serde = { workspace = true }
serde_json = "1.0.154"
tokio = { workspace = true }
tokio-stream = "0.1.19"

[dev-dependencies]
tempfile = "3.27.0"
ureq = { version = "3.5.2", features = ["json"] }
