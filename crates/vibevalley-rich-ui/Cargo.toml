[package]
name = "vibevalley-rich-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust rich UI set for VibeValley on nsh 0.6.0 (Markdown, Shiki highlighting, Mermaid diagrams, JSON Canvas, Charts, and Generative UI)"

[dependencies]
nsh-base = { version = "0.6.0", default-features = false, features = ["editor"] }
nsh-core = { version = "0.6.0", default-features = false }
ratex-font = "0.1.15"
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-types = "0.1.15"
serde_json = { workspace = true }
tokio = { workspace = true }
ttf-parser = "0.25"
vibevalley-canvas = { path = "../vibevalley-canvas" }
vibevalley-chart = { path = "../vibevalley-chart" }
vibevalley-genui = { path = "../vibevalley-genui" }
vibevalley-i18n = { path = "../vibevalley-i18n" }
vibevalley-pele = { path = "../vibevalley-pele" }
vibevalley-pinyin = { path = "../vibevalley-pinyin" }
vibevalley-pkm = { path = "../vibevalley-pkm" }
vibevalley-shiki = { path = "../vibevalley-shiki" }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
nsh-core = { version = "0.6.0", features = ["declarations"] }
nsh-js = { version = "0.6.0", default-features = false }
roxmltree = "0.21.2"
