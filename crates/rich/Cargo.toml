[package]
name = "vibevalley-rich"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false
description = "Native Rust rich UI set and rendering engines for VibeValley on nsh 0.7.1"

[[test]]
name = "suite"
path = "tests/suite.rs"

[dependencies]
base64 = { workspace = true }
nsh-base = { version = "0.7.1", default-features = false, features = ["editor", "rich-editor"] }
nsh-core = { version = "0.7.1", default-features = false, features = ["svg"] }
percent-encoding = { workspace = true }
quick-xml = { workspace = true }
ratex-font = "0.1.15"
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-types = "0.1.15"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ttf-parser = "0.25"
vibevalley-core = { path = "../core", features = ["collab"] }
vibevalley-i18n = { path = "../i18n" }
vibevalley-kit = { workspace = true }
vibevalley-pele = { path = "../engines/pele" }
vibevalley-protocol = { path = "../protocol" }
vibevalley-shiki = { path = "../engines/shiki" }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
nsh-core = { version = "0.7.1", features = ["declarations"] }
nsh-js = { version = "0.7.1", default-features = false }
resvg = { version = "0.46.0", default-features = false, features = ["text"] }
roxmltree = { workspace = true }
usvg = "0.46.0"
