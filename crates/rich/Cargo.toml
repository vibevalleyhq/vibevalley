[package]
name = "vibevalley-rich"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust rich UI set and rendering engines for VibeValley on nsh 0.6.0"

[dependencies]
nsh-base = { version = "0.6.0", default-features = false, features = ["editor"] }
nsh-core = { version = "0.6.0", default-features = false }
ratex-font = "0.1.15"
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-types = "0.1.15"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ttf-parser = "0.25"
vibevalley-protocol = { path = "../protocol" }
vibevalley-i18n = { path = "../i18n" }
vibevalley-pele = { path = "../engines/pele" }
vibevalley-shiki = { path = "../engines/shiki" }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
nsh-core = { version = "0.6.0", features = ["declarations"] }
nsh-js = { version = "0.6.0", default-features = false }
resvg = { version = "0.46.0", default-features = false, features = ["text"] }
roxmltree = "0.21.2"
usvg = "0.46.0"
