[package]
name = "vibevalley-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VibeValley's wire protocol: the contract's shapes and endpoints, and the TypeScript written from them"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
