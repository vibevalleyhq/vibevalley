[package]
name = "vibevalley-bridge"
version = "0.1.0"
edition = "2024"
description = "The contract between the hosted TSX views and the in-process server: envelope, Backend trait, dispatcher, fake backend"

[dependencies]
vibevalley-protocol = { version = "0.1.0", path = "../vibevalley-protocol" }
vibevalley-server-api = { version = "0.1.0", path = "../vibevalley-server-api" }
flume = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
