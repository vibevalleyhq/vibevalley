[package]
name = "vibevalley-oar"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "live"
path = "tests/live.rs"

[dependencies]
vibevalley-durable = { version="0.1.0", path="../vibevalley-durable" }
agent-client-protocol = "5.2.0"
base64 = { workspace = true }
vibevalley-agent = { version = "0.1.0", path = "../vibevalley-agent" }
vibevalley-home = { path = "../vibevalley-home" }
nix = { version = "0.32.0", features = ["signal", "process"] }
flume = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
proptest = "1.12.0"
