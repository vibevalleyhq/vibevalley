[package]
name = "vibevalley-oar"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "live"
path = "tests/live.rs"

[dependencies]
agent-client-protocol = "5.2.0"
base64 = "0.23.1"
nix = { version = "0.32.0", features = ["signal", "process"] }
flume = "0.12.0"
futures = "0.3.34"
jiff = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { workspace = true }

tempfile = "3.27.0"

[dev-dependencies]
proptest = "1.12.0"
