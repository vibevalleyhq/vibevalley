[package]
name = "vibevalley-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true }
vibevalley-oar = { version = "0.1.0", path = "../vibevalley-oar" }
vibevalley-home = { path = "../vibevalley-home" }
base64 = "0.23.1"
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "derive"] }
pollster = "1.0.3"
uuid = { workspace = true }
rquickjs = { package = "quickjs-jit", version = "0.14.2" }
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_parser = "0.159.0"
oxc_span = "0.159.0"
schemars = "1.2.3"
ignore = "0.4.34"
regex = "1.13.1"
globset = "0.4.21"
sha2 = "0.11.1"
flume = "0.12.0"
serde = { workspace = true }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
