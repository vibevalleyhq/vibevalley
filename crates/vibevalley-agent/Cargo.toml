[package]
name = "vibevalley-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vibevalley-durable-codemode = {version="0.1.0",path="../vibevalley-durable-codemode"}
vibevalley-durable = { version = "0.1.0", path = "../vibevalley-durable" }
sha2 = "0.11.1"
flume = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
