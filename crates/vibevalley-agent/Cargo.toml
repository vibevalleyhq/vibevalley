[package]
name = "vibevalley-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
vibevalley-durable-codemode = {version="0.1.0",path="../vibevalley-durable-codemode"}
vibevalley-durable = { version = "0.1.0", path = "../vibevalley-durable" }
sha2 = "0.11.1"
flume = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
