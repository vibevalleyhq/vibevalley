[package]
name = "vibevalley-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VibeValley's domain state reduction, frame projection, schedule rules, and artifact engine"

[features]
default = ["collab"]
collab = ["dep:loro", "dep:base64", "dep:thiserror"]
scenarios = []

[[example]]
name = "export_scenarios"
required-features = ["scenarios"]

[[test]]
name = "collab_loro"
required-features = ["collab"]

[dependencies]
vibevalley-i18n = { version = "0.1.0", path = "../i18n" }
vibevalley-protocol = { version = "0.1.0", path = "../protocol" }
base64 = { workspace = true, optional = true }
jiff = { workspace = true }
loro = { workspace = true, optional = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true, optional = true }
