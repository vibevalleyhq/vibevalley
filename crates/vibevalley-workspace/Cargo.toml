[package]
name = "vibevalley-workspace"
version = "0.1.0"
edition = "2024"

[dependencies]
vibevalley-git = { version = "0.1.0", path = "../vibevalley-git" }
vibevalley-terminal = { version = "0.1.0", path = "../vibevalley-terminal" }
pollster = "1.0.3"
serde = { workspace = true }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "derive"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
