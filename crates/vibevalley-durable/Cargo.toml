[package]
name = "vibevalley-durable"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
rusqlite = { version = "0.42.0", features = ["bundled", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v7"] }
flume = "0.12.0"

[dev-dependencies]
tempfile = "3.27.0"
